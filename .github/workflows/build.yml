name: build

on:
  push:
    branches:
      - main
      - adb-shell-bridge
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test native protocol
        run: make test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Build ARM binaries
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" \
            sh scripts/build_android.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: crawlspace-android
          path: build/*/crawlspace
