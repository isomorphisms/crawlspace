name: shizuku-d

on:
  push:
    branches:
      - shizuku-d
  pull_request:
    branches:
      - shizuku
  workflow_dispatch:

jobs:
  host-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest

      - name: Compile translated Shizuku logic
        run: |
          dmd -Isrc -unittest \
            tests/shizuku_d_logic.d \
            src/crawlspace/shizuku/types.d \
            src/crawlspace/shizuku/applications.d \
            src/crawlspace/shizuku/clients.d \
            src/crawlspace/shizuku/service.d \
            src/crawlspace/shizuku/delivery.d \
            src/crawlspace/shizuku/permission.d \
            src/crawlspace/shizuku/rish.d \
            src/crawlspace/shizuku/rish_client.d \
            src/crawlspace/shizuku/user_service.d \
            src/crawlspace/shizuku/startup.d \
            src/crawlspace/shizuku/transaction_router.d \
            -of=/tmp/shizuku_d_logic

      - name: Run translated Shizuku logic tests
        run: /tmp/shizuku_d_logic
