name: shizuku-rish

permissions:
  contents: write

on:
  push:
    branches:
      - shizuku-provisioning
  pull_request:
    branches:
      - shizuku
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Shizuku Android SDK requirements
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456"
      - name: Build controlled Shizuku rish bundle
        shell: sh
        run: sh scripts/package_shizuku_rish.sh
      - name: Test device provisioner
        shell: sh
        run: sh tests/shizuku_rish.sh
      - name: Test Shizuku runtime identity report
        shell: sh
        run: sh tests/shizuku_runtime_identity.sh
      - name: Sync durable controlled bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/shizuku-provisioning'
        shell: sh
        run: |
          rm -rf runtime/shizuku-rish
          mkdir -p runtime/shizuku-rish
          cp out/shizuku-rish/rish runtime/shizuku-rish/rish
          cp out/shizuku-rish/rish_shizuku.dex runtime/shizuku-rish/rish_shizuku.dex
          cp out/shizuku-rish/manifest.tsv runtime/shizuku-rish/manifest.tsv
          git add runtime/shizuku-rish
          if ! git diff --cached --quiet; then
            git config user.name 'crawlspace-ci'
            git config user.email 'crawlspace-ci@users.noreply.github.com'
            git commit -m 'Record controlled Shizuku rish bundle'
            git push origin HEAD:shizuku-provisioning
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crawlspace-shizuku-rish
          path: out/shizuku-rish/
          if-no-files-found: error
